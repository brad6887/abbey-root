schema_version: 1
project:
  name: Abbey Root
  slug: abbey-root
  description: Reference implementation of the Abbey Framework.
framework:
  name: Abbey
  schema_version: 1
configuration:
  allow_toolkit_defaults: false
capabilities:
  infrastructure: true
  internal_dns: true
workflow:
  journal:
    policy: required
validation:
  commands:
    - git diff --check
paths:
  planning: docs/planning
  session_updates: docs/session-updates
  journal: content/journal
site:
  source: site
  build:
    method: npm
    output: dist
  validation:
    public_root: site/public
    media_manifests: []
    required_routes:
      - /
      - /journal/
  publish:
    method: ssh-release
    target: abbey-deploy@sites01:/srv/www/abbeyroot.com
    domain: abbeyroot.com
