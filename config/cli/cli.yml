# Abbey Root CLI metadata
#
# Purpose:
#   Single source of truth for abbey command descriptions, categories,
#   aliases, examples, nested commands, and generated documentation.

version: 1

cli:
  name: abbey
  description: Abbey Root Toolkit
  tagline: AI-assisted infrastructure lab and reusable project framework.

categories:
  core:
    description: Core CLI commands

  workflow:
    description: Workflow commands

  docs:
    description: Documentation commands

  ai:
    description: AI and knowledge commands

  research:
    description: Structured research commands

  lab:
    description: Lab infrastructure commands

  site:
    description: Website commands

  content:
    description: Content management commands

commands:
  init:
    category: core
    description: Create a new Abbey project from the default template.
    usage: abbey init PATH [--name NAME] [--description TEXT] [--journal-policy POLICY] [--dry-run] [--yes] [--no-git]
    hidden: false
    examples:
      - abbey init bread-pitt --name "Bread Pitt" --yes
      - abbey init notes --journal-policy optional --yes

  help:
    category: core
    description: Show Abbey Root CLI help.
    usage: abbey help
    hidden: false
    examples:
      - abbey help

  doctor:
    category: core
    description: Run repository and environment health checks.
    usage: abbey doctor
    hidden: false
    examples:
      - abbey doctor

  status:
    category: core
    description: Show local system, repository, and project metrics.
    usage: abbey status
    hidden: false
    examples:
      - abbey status

  session:
    category: workflow
    description: Start and review Abbey Root work sessions.
    usage: abbey session [command]
    hidden: false
    subcommands:
      start:
        description: Show Abbey session startup information.
        usage: abbey session
      context:
        description: Generate an upload-ready session context file.
        usage: abbey session context [--stdout | --output FILE]

      update:
        description: Create a session update with a title-derived or explicitly overridden slug.
        usage: abbey session update --title TITLE [--slug SLUG]

      capture:
        description: Create or resume session artifacts using one resolved slug.
        usage: abbey session capture --title TITLE [--slug SLUG]

      review:
        description: Review a selected session update or the oldest unreviewed update with Codex.
        usage: abbey session review [file]

    examples:
      - abbey session
      - abbey session context
      - abbey session update --title "Abbey AI Decision Help"
      - abbey session capture --title "Guided Session Capture Workflow"
      - abbey session review
      - abbey session review docs/session-updates/2026-07-10-doctor-robert-plant-publishing-workflow.md

  end:
    category: workflow
    description: Certify that the current Abbey session is complete.
    usage: abbey end
    hidden: false
    examples:
      - abbey end

  review:
    category: workflow
    description: Review the current Abbey session before commit.
    usage: abbey review
    hidden: false
    examples:
      - abbey review

  next:
    category: workflow
    description: Recommend the next focused Abbey engineering session.
    usage: abbey next [init]
    hidden: false
    examples:
      - abbey next
      - abbey next init

  backlog:
    category: workflow
    description: Maintain generated backlog completion statistics.
    usage: abbey backlog <command>
    hidden: false
    subcommands:
      refresh:
        description: Refresh generated complete, pending, and total counts.
        usage: abbey backlog refresh
      check:
        description: Verify that generated backlog statistics are current.
        usage: abbey backlog check
    examples:
      - abbey backlog refresh
      - abbey backlog check

  docs:
    category: docs
    description: Generate and verify deterministic project documentation.
    usage: abbey docs <command>
    hidden: false
    subcommands:
      generate:
        description: Regenerate deterministic documentation from authoritative sources.
        usage: abbey docs generate
      check:
        description: Verify tracked deterministic documentation without modifying it.
        usage: abbey docs check
    examples:
      - abbey docs generate
      - abbey docs check

  journal:
    category: workflow
    description: Create or open an Abbey Root journal entry.
    usage: abbey journal <title>
    hidden: false
    examples:
      - abbey journal "Architecture Framework Introduced"

  site:
    category: site
    description: Build, run, and publish the BradCooke.com website.
    usage: abbey site <command>
    hidden: false
    subcommands:
      build:
        description: Build the Astro production site.
        usage: abbey site build

      publish:
        description: Build and publish the site to GitHub Pages.
        usage: abbey site publish [--dry-run]

      status:
        description: Show the Astro development server status.
        usage: abbey site status

      start:
        description: Start the Astro development server.
        usage: abbey site start

      stop:
        description: Stop the Astro development server.
        usage: abbey site stop

      restart:
        description: Restart the Astro development server.
        usage: abbey site restart

    examples:
      - abbey site build
      - abbey site publish --dry-run
      - abbey site publish
      - abbey site start

  image:
    category: content
    description: Select project-defined images for configured content roles.
    usage: abbey image <command>
    hidden: false
    subcommands:
      select:
        description: Select an image and assign it to a configured entity role.
        usage: abbey image select <entity> <item> --role <role>
    examples:
      - abbey image select plant martha-my-dear --role hero

  plant:
    category: content
    description: Manage, validate, and publish plant workspaces.
    usage: abbey plant <command>
    hidden: false
    subcommands:
      validate:
        description: Validate a plant workspace against the Plant Model.
        usage: abbey plant validate <slug>
      publish:
        description: Generate Astro content and copy selected public images.
        usage: abbey plant publish <slug>
      hero:
        description: Select the photograph assigned to a plant's hero role.
        usage: abbey plant hero <slug>
      index:
        description: Select the photograph used on plant index pages.
        usage: abbey plant index <slug>
      update:
        description: Add a dated observation and select its current photograph.
        usage: abbey plant update <slug> --photo FILE --narrative TEXT [--care TEXT] [--status STATUS] [--date YYYY-MM-DD] [--dry-run]
      rename-exports:
        description: Rename exported photos from XMP captions and capture dates.
        usage: abbey plant rename-exports <directory> [--dry-run]
    examples:
      - abbey plant validate doctor-robert
      - abbey plant publish doctor-robert
      - abbey plant hero doctor-robert
      - abbey plant index doctor-robert
      - abbey plant update doctor-robert --photo incoming.jpg --narrative "Firm leaves and active roots." --care "Watered."
      - abbey plant rename-exports ~/incoming/photos --dry-run

  knowledge:
    category: ai
    description: Build and view Abbey knowledge context.
    usage: abbey knowledge <command>
    hidden: false
    examples:
      - abbey knowledge build

  context:
    category: ai
    description: Build or inspect Abbey AI context.
    usage: abbey context <command>
    hidden: false
    examples:
      - abbey context

  ai:
    category: ai
    description: Start Abbey AI helper commands.
    usage: abbey ai <command>
    hidden: false
    examples:
      - abbey ai

  research:
    category: research
    description: Run structured research workflows and inspect formal research artifacts.
    usage: abbey research <command>
    hidden: false
    subcommands:
      create:
        description: Create a controlled, review-ready research candidate.
        usage: abbey research create --project PROJECT --type observation --corpus CORPUS --experiment EXPERIMENT --model MODEL --prompt FILE [--input FILE ...]
      status:
        description: Report formal research artifact relationships and chain status.
        usage: abbey research status
      validate-review:
        description: Validate a machine-readable review manifest and exact corpus citations.
        usage: abbey research validate-review --manifest FILE --corpus FILE
      validate-discovery:
        description: Validate a batch discovery manifest and exact corpus citations.
        usage: abbey research validate-discovery --manifest FILE --corpus FILE --batch FILE
      discover:
        description: Run resumable observation discovery across deterministic corpus batches.
        usage: abbey research discover --model MODEL --prompt FILE --corpus FILE --batch-manifest FILE --output-dir DIR [--resume]
      voice:
        description: Apply VOICE-MODEL-001 through an approved Facebook fact lock.
        usage: abbey research voice apply --model MODEL --fact-lock FILE --output FILE --report FILE
    examples:
      - abbey research --help
      - abbey research create --project voice-analysis --type observation --corpus CORPUS-001 --experiment EXP-001 --model gpt-oss:20b --prompt FILE --input FILE
      - abbey research run --help
      - abbey research validate-review --manifest FILE --corpus FILE
      - abbey research validate-discovery --manifest FILE --corpus FILE --batch FILE
      - abbey research discover --model MODEL --prompt FILE --corpus FILE --batch-manifest FILE --output-dir DIR --resume
      - abbey research status

  lab:
    category: lab
    description: Inspect and manage Abbey Root lab infrastructure.
    usage: abbey lab <command>
    hidden: false
    subcommands:
      check:
        description: Run read-only health checks against managed lab hosts.
        usage: abbey lab check
    examples:
      - abbey lab check

  git:
    category: lab
    description: Audit and synchronize Git configuration across managed hosts.
    usage: abbey git <command>
    hidden: false
    subcommands:
      audit:
        description: Verify Git policy, repository remotes, and GitHub SSH access.
        usage: abbey git audit [--limit HOST_OR_GROUP]
      sync:
        description: Install Git policy and normalize existing repository checkouts.
        usage: abbey git sync [--check] [--limit HOST_OR_GROUP]
    examples:
      - abbey git audit
      - abbey git sync --check
      - abbey git sync --limit ubuntu-dev01

  ssh:
    category: lab
    description: Audit and synchronize SSH public keys across managed Abbey nodes.
    usage: abbey ssh <command>
    hidden: false
    subcommands:
      audit:
        description: Report node public-key authorization across managed hosts.
        usage: abbey ssh audit [--limit HOST_OR_GROUP]
      sync:
        description: Synchronize Abbey node public keys through a managed authorized_keys block.
        usage: abbey ssh sync [--check] [--limit HOST_OR_GROUP]
    examples:
      - abbey ssh audit
      - abbey ssh sync --check
      - abbey ssh sync
      - abbey ssh sync --limit edge01

  version:
    category: core
    description: Show project version and framework information.
    usage: abbey version
    hidden: false
    examples:
      - abbey version
