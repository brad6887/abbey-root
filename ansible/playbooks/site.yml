---
# ============================================================================
# Base operating system configuration
# ============================================================================

- name: Configure all hosts
  hosts: all
  become: true

  roles:
    - common
    - role: dns_client
      tags:
        - dns
    - time
    - motd
    - issue

# ============================================================================
# Container infrastructure
# ============================================================================

- name: Verify Docker hosts
  hosts: infrastructure:ai
  become: true

  roles:
    - docker

# ============================================================================
# Application deployment
# ============================================================================

- name: Manage Homepage
  hosts: ubuntu-dev01
  become: true

  roles:
    - homepage

- name: Manage Umami
  hosts: ubuntu-dev01
  become: true

  roles:
    - umami

- name: Manage labtest container
  hosts: ubuntu-dev01
  become: true

  roles:
    - labtest

# ============================================================================
# Static website hosting
# ============================================================================

- name: Configure static website hosts
  hosts: web
  become: true

  roles:
    - static_site_host
