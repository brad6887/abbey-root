---
- name: Validate required Umami secrets
  ansible.builtin.assert:
    that:
      - umami_database_password is defined
      - umami_database_password | default('') | length > 0
      - umami_app_secret is defined
      - umami_app_secret | default('') | length > 0
    fail_msg: >-
      Define umami_database_password and umami_app_secret in encrypted
      inventory before managing Umami.
  no_log: true

- name: Create Umami compose directory
  ansible.builtin.file:
    path: "{{ umami_compose_dir }}"
    state: directory
    owner: "{{ umami_owner }}"
    group: "{{ umami_group }}"
    mode: "0750"

- name: Deploy Umami Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ umami_compose_dir }}/docker-compose.yml"
    owner: "{{ umami_owner }}"
    group: "{{ umami_group }}"
    mode: "0600"
  no_log: true
  notify: Redeploy Umami
