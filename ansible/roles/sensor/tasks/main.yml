---
- name: Install USB serial support
  ansible.builtin.apt:
    name:
      - python3-serial
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Grant the Abbey administrator serial device access
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups:
      - dialout
    append: true

- name: Create the Abbey sensor application directory
  ansible.builtin.file:
    path: "{{ sensor_application_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the Abbey sensor data directory
  ansible.builtin.file:
    path: "{{ sensor_data_directory }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0750"

- name: Install the SHT41 logger
  ansible.builtin.copy:
    src: sht41_logger.py
    dest: "{{ sensor_application_directory }}/sht41_logger.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Abbey SHT41 logger

- name: Install the latest reading command
  ansible.builtin.copy:
    src: abbey-sensor-latest
    dest: /usr/local/bin/abbey-sensor-latest
    owner: root
    group: root
    mode: "0755"

- name: Install the SHT41 systemd service
  ansible.builtin.template:
    src: abbey-sht41.service.j2
    dest: /etc/systemd/system/abbey-sht41.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Abbey SHT41 logger

- name: Enable and start the SHT41 logger
  ansible.builtin.systemd:
    name: abbey-sht41.service
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
