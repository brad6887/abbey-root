---
- name: Reload firewalld
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --reload
  changed_when: true
  when: not ansible_check_mode

- name: Validate nginx before reload
  ansible.builtin.command:
    argv:
      - /usr/sbin/nginx
      - -t
  changed_when: false
  listen: Reload nginx
  when: not ansible_check_mode

- name: Reload nginx service
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  listen: Reload nginx
  when: not ansible_check_mode
