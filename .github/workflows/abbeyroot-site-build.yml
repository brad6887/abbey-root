name: AbbeyRoot.com Build

on:
  pull_request:
    paths:
      - "site/**"
      - "content/journal/**"
      - ".abbey/project.yml"
      - ".github/workflows/abbeyroot-site-build.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "content/journal/**"
      - ".abbey/project.yml"
      - ".github/workflows/abbeyroot-site-build.yml"

permissions:
  contents: read

concurrency:
  group: abbeyroot-site-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AbbeyRoot.com build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out Abbey Root
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify required routes
        run: |
          test -f dist/index.html
          test -f dist/journal/index.html

